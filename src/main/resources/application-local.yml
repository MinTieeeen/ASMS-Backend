# Local environment: uses asms-backend/docker-compose.yml (Postgres, Redis, Mailpit).
spring:
  config:
    # Lets ./mvnw spring-boot:run read the same .env as docker compose
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/asms
    username: asms
    password: asms
  data:
    redis:
      host: localhost
      port: 6379
  mail: # Mailpit SMTP by default (inbox at http://localhost:8025); set MAIL_* in .env to send real emails
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # LOCAL ONLY. Other environments must provide APP_JWT_SECRET (>= 32 characters).
    secret: ${APP_JWT_SECRET:local-dev-secret-change-me-at-least-32-chars}
  auth:
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:false} # Plain HTTP on localhost

logging:
  level:
    com.asms: DEBUG
    org.hibernate.SQL: DEBUG
