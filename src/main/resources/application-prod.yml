# Production: every secret comes from environment variables; never commit real values.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

server:
  # Behind the reverse proxy: take the client IP from trusted X-Forwarded-For only (rate limits, session IPs)
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs # Structured JSON logs (NFR18)
