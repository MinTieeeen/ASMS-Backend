# Shared settings for every environment. Environment-specific values go in application-{profile}.yml.
spring:
  application:
    name: asms-backend
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema changes only through Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # BR13
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB # BR14
      max-request-size: 26MB
  mvc:
    problemdetails:
      enabled: true
  cache:
    type: redis
    redis:
      time-to-live: 10m

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.asms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  default-timezone: Asia/Ho_Chi_Minh
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: asms
    access-token-ttl: 15m # NFR06
    refresh-token-ttl: 7d
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
