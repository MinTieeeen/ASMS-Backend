# Shared settings for every environment. Environment-specific values go in application-{profile}.yml.
spring:
  application:
    name: asms-backend
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Schema changes only through Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # BR13
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB # BR14
      max-request-size: 26MB
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100 # API conventions: enforce a maximum page size
    redis:
      # Short timeouts: when Redis is down, auth keeps working without blocklist and rate limits (NFR-AUTH-10)
      timeout: 1s
      connect-timeout: 1s
  cache:
    type: redis
    redis:
      time-to-live: 10m

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.asms

jobrunr: # Email queue (NFR-AUTH-08); tables jobrunr_* are created by JobRunr itself
  background-job-server:
    enabled: true
    worker-count: 4
  jobs:
    default-number-of-retries: 0 # AuthMailJob schedules its own retries (1, 5, 15 minutes)
    # Job arguments contain email links with one-time tokens: keep finished jobs as briefly as possible
    delete-succeeded-jobs-after: 1h
    permanently-delete-deleted-jobs-after: 1h
  dashboard:
    enabled: false
  miscellaneous:
    allow-anonymous-data-usage: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  default-timezone: Asia/Ho_Chi_Minh
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: asms
    key-id: ${APP_JWT_KEY_ID:k1} # "kid" header, allows key rotation
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth: # Auth specification section 7.10
    access-token-ttl: 15m # BR-AUTH-07
    refresh-ttl-remember: 30d # BR-AUTH-05
    refresh-ttl-default: 12h # BR-AUTH-05
    session-absolute-ttl: 30d # BR-AUTH-06
    max-sessions-per-user: 10 # BR-AUTH-08
    lockout:
      max-attempts: 5 # BR-AUTH-04
      duration: 15m
    activation-token-ttl: 72h # BR-AUTH-11
    reset-token-ttl: 30m # BR-AUTH-11
    refresh-race-window: 5s # Section 7.3
    cleanup-grace-period: 7d # NFR-AUTH-09
    cleanup-cron: "0 17 3 * * *" # AuthCleanupJob, daily at 03:17 (default-timezone)
    event-retention: 180d # NFR-AUTH-14
    cookie:
      name: rt
      path: /api/v1/auth
      domain: ${APP_AUTH_COOKIE_DOMAIN:}
      secure: ${APP_AUTH_COOKIE_SECURE:true} # NFR-AUTH-05
  mail:
    from: ${APP_MAIL_FROM:randy2032005@gmail.com}
  bootstrap-admin: # FR-AUTH-24
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    user-code: ${APP_BOOTSTRAP_ADMIN_USER_CODE:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:Quản trị viên}
