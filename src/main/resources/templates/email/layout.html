<!doctype html>
<!-- Shared layout and building blocks of every email (section 7.9). Texts come from i18n/email*.properties. -->
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- Page frame: title for the <title> tag, content = fragment with the email body -->
    <html th:fragment="page(title, content)" th:lang="${#locale.language}">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="${title}">Title</title>
      </head>
      <body
        style="
          margin: 0;
          padding: 0;
          background: #f4f4f5;
          font-family: Arial, Helvetica, sans-serif;
          color: #18181b;
        "
      >
        <table
          role="presentation"
          width="100%"
          cellpadding="0"
          cellspacing="0"
          style="background: #f4f4f5; padding: 24px 0"
        >
          <tr>
            <td align="center">
              <table
                role="presentation"
                width="100%"
                cellpadding="0"
                cellspacing="0"
                style="
                  max-width: 520px;
                  background: #ffffff;
                  border-radius: 12px;
                  padding: 32px;
                "
              >
                <tr>
                  <td>
                    <p
                      style="
                        margin: 0 0 24px;
                        font-size: 18px;
                        font-weight: bold;
                      "
                      th:text="#{email.common.brand}"
                    >
                      Brand
                    </p>
                    <h1
                      style="margin: 0 0 16px; font-size: 20px"
                      th:text="${title}"
                    >
                      Title
                    </h1>
                    <p
                      style="margin: 0 0 12px"
                      th:text="#{email.common.greeting(${fullName})}"
                    >
                      Greeting
                    </p>
                    <th:block th:replace="${content}" />
                    <p
                      style="margin: 32px 0 0; font-size: 12px; color: #71717a"
                      th:text="#{email.common.autoGenerated}"
                    >
                      Footer
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </body>
    </html>

    <!-- Paragraph of body text -->
    <p th:fragment="paragraph(text)" style="margin: 0 0 12px" th:text="${text}">
      Text
    </p>

    <!-- Small grey note -->
    <p
      th:fragment="note(text)"
      style="margin: 24px 0 0; font-size: 13px; color: #52525b"
      th:text="${text}"
    >
      Note
    </p>

    <!-- Call-to-action button followed by the copyable link, for mail clients that block buttons -->
    <th:block th:fragment="action(href, label)">
      <p style="margin: 24px 0">
        <a
          th:href="${href}"
          th:text="${label}"
          style="
            display: inline-block;
            background: #18181b;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
          "
          >Action</a
        >
      </p>
      <p
        style="margin: 0 0 8px; font-size: 13px; color: #52525b"
        th:text="#{email.common.copyLinkHint}"
      >
        Hint
      </p>
      <p style="margin: 0; font-size: 13px; word-break: break-all">
        <a th:href="${href}" th:text="${href}">Link</a>
      </p>
    </th:block>
  </body>
</html>
