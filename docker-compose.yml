# Backend infrastructure for ASMS (requirement section 9.7).
#   docker compose up -d                        -> Postgres, Redis, Mailpit (run the API with ./mvnw spring-boot:run)
#   docker compose --profile app up -d --build  -> same infrastructure plus the API container
# Variables are read from .env (copy .env.example).
name: asms-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asms
      POSTGRES_USER: asms
      POSTGRES_PASSWORD: asms
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asms -d asms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO(F05.07): add S3-compatible object storage for attachments. minio/minio is no longer published on Docker Hub.

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI: http://localhost:8025

  api:
    profiles: ["app"]
    build: .
    image: asms-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/asms
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-secret-change-me-at-least-32-chars}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}

volumes:
  postgres-data:
  redis-data:
